[project]
name = "my-calc-project"
version = "0.1.5"
description = "I'm creating my own calculator on Python."
readme = "README.md"
authors = [
    { name = "Alex", email = "saha12345m@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
calc = "my_calc_project.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "ruff>=0.17.1",
]
